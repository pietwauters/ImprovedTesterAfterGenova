; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; -----------------------------------------------------------------------------
; Hardware revisions
; -----------------------------------------------------------------------------
; This firmware targets two physically different tester boards. The pin
; definitions in src/Hardware.h are selected at compile time by the
; HARDWARE_REV build flag, which is set *only* by the per-revision envs below.
;
;   pio run -e hw_rev1        build for the original hardware
;   pio run -e hw_rev2        build for the new hardware
;
; There is deliberately no `default_envs`: a bare `pio run` builds nothing,
; so you can never flash a revision by accident. src/Hardware.h #errors out
; if HARDWARE_REV is missing or unknown, so an ambiguous binary cannot exist.
; -----------------------------------------------------------------------------

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino, espidf
extra_scripts = extra_script.py

monitor_speed = 115200
monitor_filters = time, default

board_build.sdkconfig = sdkconfig.defaults
board_build.partitions = min_spiffs.csv
board_build.flash_size = 4MB


build_unflags =
    -Wall
    -Werror=all
    -Wextra


build_flags =
    -DCORE_DEBUG_LEVEL=1  # Arduino log level (0 = NONE, 1 = ERROR, 2 = WARN, 3 = INFO, 4 = DEBUG, 5 = VERBOSE)
    -DLOG_LOCAL_LEVEL=ESP_LOG_ERROR  # ESP-IDF log level for application
    -DCERT_EMBEDDED
    -Wall
    -Wextra
    -Wno-error=switch
    -Wno-error=return-type
    -Wno-error=unused-parameter
    -std=gnu++11
    -DELEGANTOTA_USE_ASYNC_WEBSERVER
    -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
    -DCONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=1
    -DESP_TIMER_TASK_CORE=1  # Sensor core: 1=APP_CPU (isolated from WiFi/lwIP). Must match patch in esp_timer.c.



; Fix double lib_deps and spacing
lib_deps =

    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    tzapu/WiFiManager@^2.0.17
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/ayushsharma82/ElegantOTA
    https://github.com/MajicDesigns/MD_MAX72XX


[env:hw_rev1]
build_flags =
    ${env.build_flags}
    -DHARDWARE_REV=1

[env:hw_rev2]
build_flags =
    ${env.build_flags}
    -DHARDWARE_REV=2
